<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材质品质验收 · 远风之地</title></head>
<body><div id="game"></div><div id="ui"></div>
<details id="art-controls" style="position:fixed;left:8px;bottom:82px;z-index:30;background:#183c32ed;color:#f6edce;padding:8px;border:1px solid #c8b078;border-radius:8px;max-width:420px;font-size:12px"><summary>材质验收工具（独立测试存档）</summary><div id="art-sites" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px"></div><div id="art-inputs" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px"></div><pre id="art-check" style="max-height:160px;overflow:auto;white-space:pre-wrap">等待场景</pre></details>
<script type="module">
import Phaser from 'phaser';
import {World} from '../src/game/scenes/World';
import {initialState,parseSave} from '../src/game/systems/state';
import {terrainBlocked,solidPropAt,props} from '../src/data/world';
import '../src/style.css';import '../src/runes.css';import '../src/commission.css';import '../src/equipment.css';import '../src/shop.css';import '../src/hud.css';
const sites=[['plaza','广场',680,930],['training','练习场',1580,770],['pharmacy','药师院',1180,720],['village-pond','湖岸',1280,1510],['forest-road','森林',2840,1220],['south-boundary','田野',800,1900],['west-road','旧农庄',-600,1320],['north-road','山道',650,-300],['north-ruins','北部遗迹',2370,-650],['ruins-boundary','遗迹',3300,350],['west-pond','西塘',-1320,740],['south-reed','芦塘',950,2510],['south-deep','深塘',1780,2940],['east-pool','峡谷',2420,940],['river','河道',2500,1350],['fountain-back','喷泉背面',680,750],['bridge-north','桥北',1090,900],['bridge-south','桥南',1090,1435]];
const query=new URLSearchParams(location.search),site=sites.find(s=>s[0]===query.get('site'))??sites[0];
for(const s of sites){const a=document.createElement('a');a.href=`?site=${s[0]}&time=${query.get('time')??720}`;a.textContent=s[1];a.style.color='#f6edce';document.querySelector('#art-sites').append(a);}
for(const [name,time]of [['白天',720],['黄昏',1080],['夜晚',1220]]){const a=document.createElement('a');a.href=`?site=${site[0]}&time=${time}`;a.textContent=name;a.style.color='#e5c574';document.querySelector('#art-sites').append(a);}
let scene;
for(const [label,key]of [['左走','a'],['右走','d'],['上走','w'],['下走','s'],['攻击','j'],['交互','e']]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>{scene.ui.focusGame?.();window.dispatchEvent(new KeyboardEvent('keydown',{key}));setTimeout(()=>window.dispatchEvent(new KeyboardEvent('keyup',{key})),key==='j'||key==='e'?100:1300);};document.querySelector('#art-inputs').append(button);}
let sampling=false,sampled=false,frames=[],bakes=[],loops=0;
const measure=document.createElement('button');measure.textContent='采样45秒';measure.onclick=()=>{sampling=true;sampled=false;frames=[];measure.disabled=true;setTimeout(()=>{sampling=false;sampled=true;measure.disabled=false;const f=frames.slice().sort((a,b)=>a-b),mean=frames.reduce((a,b)=>a+b,0)/Math.max(1,frames.length);document.querySelector('#art-check').textContent=JSON.stringify({说明:'真实浏览器原始帧间隔，未过滤长帧；独立测试存档',地点:site[0],帧数:frames.length,平均帧率:1000/mean,帧时间百分之九十五:f[Math.ceil(f.length*.95)-1],超过五十毫秒:frames.filter(v=>v>50).length,地面块:scene.data.get('groundSnapshot')?.(),材质:scene.data.get('appearanceSnapshot')?.(),单块生成毫秒:bakes,对象:scene.children.length,纹理:scene.textures.getTextureKeys().length},null,2);},45000);};document.querySelector('#art-inputs').append(measure);
class ArtPreview extends World{create(){scene=this;const original=this.textures.createCanvas;this.textures.createCanvas=(...args)=>{const start=performance.now(),t=original.apply(this.textures,args);if(t&&String(args[0]).startsWith('ground-')){const refresh=t.refresh.bind(t);t.refresh=()=>{const r=refresh();bakes.push(performance.now()-start);return r;};}return t;};this.events.once('shutdown',()=>{this.textures.createCanvas=original;});super.create();const s=initialState();let point;for(let radius=0;radius<=180&&!point;radius+=10)for(let i=0;i<(radius?16:1);i++){const a=i*Math.PI/8,x=site[2]+Math.cos(a)*radius,y=site[3]+Math.sin(a)*radius;if(!terrainBlocked(x,y)&&!solidPropAt(x,y)){point={x,y};break;}}if(!point)throw Error('验收站位不可通行');Object.assign(s.player,point);Object.assign(s.xiaobao,point);s.time=Number(query.get('time')??720);this.ui.actions.import(parseSave(JSON.stringify(s))).catch(e=>this.ui.title(`验收启动失败：${e.message}`));this.events.on('postupdate',()=>{if(this.active&&!sampling&&!sampled&&++loops%30===0)document.querySelector('#art-check').textContent=JSON.stringify({说明:'正式逻辑与原地图，测试仅指定合法出生点和时刻',地点:site[0],玩家:{x:this.state.player.x,y:this.state.player.y,hp:this.state.player.hp},地面块:this.data.get('groundSnapshot')?.(),材质:this.data.get('appearanceSnapshot')?.(),缺失素材:[...this.propImages].filter(([,im])=>im.texture.key==='__MISSING').map(([id])=>id),水景:this.waterEffects?(()=>{const w=this.waterEffects.snapshot();return {计时毫秒:w.time,运行:w.running,池更新:w.pondUpdates,泉更新:w.fountainUpdates,数量:w.counts};})():null,对象:this.children.length,纹理:this.textures.getTextureKeys().length,浏览器前台:!document.hidden&&document.hasFocus(),逻辑物件:props.length},null,2);});}}
const width=Math.min(1920,Math.round(innerWidth*Math.min(devicePixelRatio,1.5))),game=new Phaser.Game({type:Phaser.WEBGL,parent:'game',width,height:Math.round(width*innerHeight/innerWidth),backgroundColor:'#90ac6f',render:{antialias:true,antialiasGL:true,pixelArt:false,roundPixels:false},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[ArtPreview],audio:{noAudio:true}});
game.events.on('step',()=>{if(sampling&&scene?.active&&!scene.ui.paused&&!document.hidden&&document.hasFocus())frames.push(game.loop.rawDelta);});
addEventListener('resize',()=>{const w=Math.min(1920,Math.round(innerWidth*Math.min(devicePixelRatio,1.5)));game.scale.setGameSize(w,Math.round(w*innerHeight/innerWidth));});
</script></body></html>
