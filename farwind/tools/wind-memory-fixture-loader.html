<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>风忆独立样本</title><style>body{font:18px system-ui;max-width:760px;margin:5rem auto;background:#efe8d6;color:#31422f}select,button{font:inherit;padding:1rem;margin:.5rem}p{line-height:1.6}</style><h1>风忆远征独立验收</h1><p>此工具只放置初始条件，使用独立本机测试端口；不会访问正式游戏端口的存档。载入后由真实游戏处理伤害、补援与保存，不提供运行时改血、击杀或通关接口。</p><select aria-label="验收样本"><option value="low">北路第1档普通波次</option><option value="high">北路第20档普通补援</option><option value="boss">东路第5档首领</option><option value="preview">北路下一档开启预览</option></select><button>载入独立样本并开始</button><p role="status"></p><script type="module">
document.querySelector('button').onclick=async()=>{try{document.querySelector('button').disabled=true;const sample=await(await fetch('./'+document.querySelector('select').value+'.json')).json();const request=indexedDB.open('farwind-combat-v2',1);request.onupgradeneeded=()=>request.result.createObjectStore('states');request.onsuccess=()=>{const db=request.result,t=db.transaction('states','readwrite');t.objectStore('states').put(sample,'current');t.oncomplete=()=>{db.close();location.href='./?combatObservation';};t.onerror=t.onabort=()=>{document.querySelector('[role=status]').textContent='样本准备失败。';db.close();};};}catch(e){document.querySelector('[role=status]').textContent=e.message;document.querySelector('button').disabled=false;}};
</script></html>
