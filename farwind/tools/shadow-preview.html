<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实体阴影 · 固定对照</title>
<style>body{margin:0;background:#ecedda;color:#263c31;font-family:system-ui}header{padding:18px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:22px;margin:0}button,select{padding:9px 14px;font:inherit;color:inherit;background:#faf5df;border:1px solid #687b59;border-radius:6px}#preview{max-width:1400px;margin:auto}p{padding:0 24px;margin:0 0 12px}canvas{display:block}</style></head>
<body><header><h1>实体阴影 · 固定对照</h1><button id="toggle">查看原阴影</button><button id="pause">暂停动画</button><label>光照 <select id="light"><option value="480">白天</option><option value="1080">黄昏</option><option value="1260">夜间</option><option value="indoor">室内</option></select></label><label>方向 <select id="direction"><option value="0">朝南</option><option value="1">朝北</option><option value="2">朝西</option><option value="3">朝东</option></select></label><label>动作 <select id="action"><option value="idle">待机</option><option value="walk">行走</option><option value="attack">攻击</option><option value="death">阵亡</option></select></label></header>
<p><label>首领 <select id="boss"></select></label> <label>地面 <select id="ground"><option value="grass">草地</option><option value="forest">林地</option><option value="road">石路</option></select></label></p><p id="status">正在加载正式怪物素材……</p><div id="preview"></div><p>十四种小怪与可切换的四位首领使用正式渲染器。固定审阅场不读取或写入游戏存档，实机接入另行验证。</p><script type="module" src="/src/shadow-preview.ts"></script></body></html>
