<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小宝 · 听风小宗师 · 动作审阅</title>
  </head>
  <body>
    <main>
      <header class="intro">
        <img src="/assets/xiaobao/portrait.webp" alt="已认可的小宝身份原画" />
        <div>
          <p class="eyebrow">远风之地 · 风铃村的新朋友</p>
          <h1>小宝 <span>听风小宗师</span></h1>
          <p>“风很大，也可以轻轻的。”</p>
          <p>星星衣、青绿披肩、小门牙和笑眼。先听懂了风，才学会走路的隐藏高手。</p>
          <p class="note">身份原画已认可 · 16组动作／96帧 · 动画美术待验收</p>
        </div>
      </header>
      <section class="stage">
        <div class="toolbar">
          <label>选择动作 <select id="action"></select></label>
          <label>朝向 <select id="direction"><option value="right">原始方向</option><option value="left">水平镜像</option></select></label>
          <button id="pause">暂停</button>
          <button id="restart">从头播放</button>
          <button id="show-all">连续看全部动作</button>
        </div>
        <div id="preview" aria-label="小宝动作画面"></div>
        <div class="timeline"><label for="scrub">逐帧查看</label><input id="scrub" type="range" min="0" max="2099" value="0" /><output id="info"></output></div>
      </section>
      <section class="cards" id="clips" aria-label="十六组动作"></section>
      <footer>在游戏风铃广场找到小宝，靠近按 E，可以请他演示武学。<a href="/">进入游戏</a></footer>
    </main>
    <script type="module" src="/src/xiaobao-preview.ts"></script>
  </body>
</html>
