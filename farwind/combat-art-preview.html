<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四据点高清动作审阅</title><style>body{margin:0;background:#e7e0cb;color:#253d33;font-family:system-ui}main{max-width:1400px;margin:auto;padding:12px}h1{font-family:serif;font-size:24px;margin:0 0 10px}p{font-size:14px;margin:8px 0}section{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}label{display:flex;align-items:center;gap:8px}select,button,input{font:inherit;padding:7px;border:1px solid #778779;border-radius:6px;background:#fff8e5}#preview{width:100%;height:min(650px,calc(100dvh - 180px));min-height:220px}canvas{display:block;max-width:100%}#info{min-height:2em}a{color:#355b48}</style></head><body><main><h1>四据点高清动作与体量审阅</h1><p>固定素材预览使用正式渲染器；左侧二倍检查，右侧世界原尺寸与主角对照。不运行战斗，不读写存档；正式键鼠验收另行记录。</p><section><label>角色<select id="actor"></select></label><label>动作<select id="action"><option value="idle">待机</option><option value="walk">行走</option></select></label><label>方向<select id="direction"><option value="0">朝下</option><option value="1">朝上</option><option value="2">朝左（镜像）</option><option value="3">朝右</option></select></label><button id="pause">暂停播放</button><button id="restart">从头播放</button><a href="/">正式游戏</a></section><div id="preview"></div><p id="info" role="status"></p><section><label>动作时钟<input id="scrub" type="range" min="0" max="2500" value="0" step="1"></label></section></main><script type="module" src="/src/combat-art-preview.ts"></script></body></html>
