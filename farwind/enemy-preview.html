<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八种敌人动画审阅</title></head><body class="slime-preview"><main><h1>八种敌人完整动画 · 候选待审阅</h1><p>左侧放大检查姿态；右侧为游戏建议显示尺寸，与现有主角对照。固定预览不运行战斗，也不读写存档。</p><div class="controls">
<label>怪物<select id="enemy"><option value="slime">苔团史莱姆</option><option value="leaf">裂枝镰灵</option><option value="spore">灰冠孢卫</option><option value="boar">棘甲林豕</option><option value="raven">暮羽鸦妖</option><option value="wolf">荆棘狼</option><option value="burrow">潜地虫</option><option value="guardian">苔甲守卫</option></select></label>
<label>动作<select id="action"><option value="idle">待机</option><option value="walk">移动</option><option value="attack">招牌攻击</option><option value="hurt">普通受击</option><option value="parry">普通弹反</option><option value="perfect">精准弹反</option><option value="death">死亡</option><option value="wall">林豕撞墙</option></select></label>
<label>方向<select id="direction"><option value="0">朝下</option><option value="1">朝上</option><option value="2">朝左（镜像）</option><option value="3">朝右</option></select></label><label>背景<select id="background"><option value="forest-day">白天森林</option><option value="village-night">夜间村庄</option></select></label><button id="pause">暂停</button><button id="restart">从头播放</button></div><div id="preview"></div><p id="info"></p><div class="controls"><label>时间<input id="scrub" type="range" min="0" max="1000" step="1" value="0"></label><a href="/">正式游戏入口</a><a href="/docs/enemy-combat-v1/index.html">集中审阅索引</a></div></main><script type="module" src="/src/enemy-preview.ts"></script></body></html>
