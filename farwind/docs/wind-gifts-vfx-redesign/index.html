<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风赐特效 · 全新设计图鉴</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c18;color:#e9e6d5;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:clamp(24px,4vw,40px);margin:0}p{color:#bdc8ba}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}a,button{color:#eee3bd}nav button{background:#22382e;border:1px solid #53674e;border-radius:8px;padding:8px 12px;cursor:pointer}nav button[aria-pressed=true]{background:#566447;color:#fff7d5}section{margin:32px 0 56px}h2{font-size:24px;margin:12px 0}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #58684c;border-radius:12px}figcaption{margin:12px 0;color:#d4ddcb}ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;padding:0;list-style:none}li{padding:12px;background:#1b2b23;border-radius:8px;min-width:0}li strong{display:block;color:#f1ddb0}li span{font-size:14px;color:#b8c9b6}footer{margin:48px 0;color:#b8c9b6}@media(max-width:600px){main{padding:16px}ul{grid-template-columns:1fr}}[hidden]{display:none!important}
</style></head><body><main><header><h1>风赐特效 · 全新设计图鉴</h1><p>60 种非黑洞风赐 · 18 组共鸣 · 13 张独立设计图</p><p>黑洞斩保持不变。本页为 imagegen 生成的场景关键帧概念；新动画尚未制作、尚未替换进游戏。可点击原图查看细节。</p></header><nav aria-label="查看流派"><button type="button" data-filter="all" aria-pressed="true">全部设计</button><button type="button" data-filter="offense" aria-pressed="false">进攻</button><button type="button" data-filter="survival" aria-pressed="false">防御与恢复</button><button type="button" data-filter="tactics" aria-pressed="false">身法与伙伴</button><button type="button" data-filter="resonance" aria-pressed="false">共鸣</button></nav><div id="gallery"></div><footer>逐项视觉与触发设计见本目录设计文件。角色动作、范围和数值以正式游戏为准，概念图不增加新的战斗能力。</footer></main><script>
fetch('./assets/prompts.json').then(r=>r.json()).then(data=>{const categories=['offense','offense','offense','offense','survival','survival','survival','tactics','tactics','tactics','resonance','resonance','resonance'];const gallery=document.getElementById('gallery');for(const [i,entry] of data.图组.entries()){const section=document.createElement('section');section.dataset.category=categories[i];const heading=document.createElement('h2');heading.textContent=entry.主题;section.append(heading);const figure=document.createElement('figure'),link=document.createElement('a'),image=document.createElement('img'),caption=document.createElement('figcaption');link.href='./assets/'+entry.文件;link.target='_blank';link.rel='noopener';image.src=link.href;image.alt=entry.主题+'：'+entry.风赐.map(g=>g.名称).join('、');image.loading=i?'lazy':'eager';caption.textContent=entry.风赐.map(g=>g.名称).join(' · ');link.append(image);figure.append(link,caption);section.append(figure);const list=document.createElement('ul');for(const gift of entry.风赐){const row=document.createElement('li'),name=document.createElement('strong'),description=document.createElement('span');name.textContent=gift.名称;description.textContent=gift.设计;row.append(name,description);list.append(row);}section.append(list);gallery.append(section);}for(const button of document.querySelectorAll('nav button'))button.onclick=()=>{for(const other of document.querySelectorAll('nav button'))other.setAttribute('aria-pressed',String(other===button));for(const section of gallery.children)section.hidden=button.dataset.filter!=='all'&&section.dataset.category!==button.dataset.filter;};}).catch(()=>{document.getElementById('gallery').textContent='请通过项目本地预览地址打开本页，或直接查看 assets 文件夹中的设计图。';});
</script></body></html>
