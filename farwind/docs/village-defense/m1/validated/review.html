<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远风之地：一期实机对照</title><style>body{margin:0;color:#e9ebdd;background:#192e27;font:16px/1.6 system-ui}main{max-width:1450px;margin:auto;padding:24px}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding:16px;background:#314b40}h1{margin-top:0}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0}img{width:100%;height:auto;display:block;cursor:zoom-in}figcaption{padding:8px;background:#314b40}a{color:#d6dfa0}section{margin:32px 0}img.full{width:1280px;max-width:none}@media(max-width:900px){.pair{grid-template-columns:1fr}}</style><main><h1>一期通路返修 · 固定视口实机对照</h1><p>同一冻结提交基础、1280×720、相同站位与镜头规则、第1日08:00。右侧为最终一期候选，左侧为原版。截图通过正式存档导入建立站位，暂停后截图；通行及战斗由另行真实输入回归证明。</p><div class="controls"><label><input id="clean" type="checkbox" checked> 无HUD检查</label><span>点击图片可展开至原始1280宽度。</span><a href="layout.html">坐标与功能叠层</a><a href="REPORT.md">功能与美术报告</a></div><p>美术状态：候选待人工确认。没有自动更新或批准视觉基线；未测目标设备性能。共享工作区的并发弹反、对话和场景美术没有混入此对照。</p><section><h2>北门</h2><p>站位（820，420）</p><div class="pair"><figure><a target="_blank" href="before/north-gate-clean.png"><img data-phase="before" data-id="north-gate" src="before/north-gate-clean.png" alt="北门修改前"></a><figcaption>修改前 · c4c864a</figcaption></figure><figure><a target="_blank" href="after-v4/north-gate-clean.png"><img data-phase="after-v4" data-id="north-gate" src="after-v4/north-gate-clean.png" alt="北门一期候选"></a><figcaption>修改后 · 一期候选，待人工确认</figcaption></figure></div></section><section><h2>东门</h2><p>站位（2050，1080）</p><div class="pair"><figure><a target="_blank" href="before/east-gate-clean.png"><img data-phase="before" data-id="east-gate" src="before/east-gate-clean.png" alt="东门修改前"></a><figcaption>修改前 · c4c864a</figcaption></figure><figure><a target="_blank" href="after-v4/east-gate-clean.png"><img data-phase="after-v4" data-id="east-gate" src="after-v4/east-gate-clean.png" alt="东门一期候选"></a><figcaption>修改后 · 一期候选，待人工确认</figcaption></figure></div></section><section><h2>南门</h2><p>站位（900，1710）</p><div class="pair"><figure><a target="_blank" href="before/south-gate-clean.png"><img data-phase="before" data-id="south-gate" src="before/south-gate-clean.png" alt="南门修改前"></a><figcaption>修改前 · c4c864a</figcaption></figure><figure><a target="_blank" href="after-v4/south-gate-clean.png"><img data-phase="after-v4" data-id="south-gate" src="after-v4/south-gate-clean.png" alt="南门一期候选"></a><figcaption>修改后 · 一期候选，待人工确认</figcaption></figure></div></section><section><h2>封闭西界</h2><p>站位（180，1380）</p><div class="pair"><figure><a target="_blank" href="before/west-boundary-clean.png"><img data-phase="before" data-id="west-boundary" src="before/west-boundary-clean.png" alt="封闭西界修改前"></a><figcaption>修改前 · c4c864a</figcaption></figure><figure><a target="_blank" href="after-v4/west-boundary-clean.png"><img data-phase="after-v4" data-id="west-boundary" src="after-v4/west-boundary-clean.png" alt="封闭西界一期候选"></a><figcaption>修改后 · 一期候选，待人工确认</figcaption></figure></div></section><section><h2>原广场</h2><p>站位（670，780）</p><div class="pair"><figure><a target="_blank" href="before/plaza-clean.png"><img data-phase="before" data-id="plaza" src="before/plaza-clean.png" alt="原广场修改前"></a><figcaption>修改前 · c4c864a</figcaption></figure><figure><a target="_blank" href="after-v4/plaza-clean.png"><img data-phase="after-v4" data-id="plaza" src="after-v4/plaza-clean.png" alt="原广场一期候选"></a><figcaption>修改后 · 一期候选，待人工确认</figcaption></figure></div></section><script>document.getElementById('clean').addEventListener('change',e=>{document.querySelectorAll('img[data-id]').forEach(i=>{const path=i.dataset.phase+'/'+i.dataset.id+(e.target.checked?'-clean':'')+'.png';i.src=path;i.parentElement.href=path})});</script></main></html>
