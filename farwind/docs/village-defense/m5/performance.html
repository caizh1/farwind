<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M5实际GPU性能记录</title><style>body{margin:0;padding:24px;background:#f1f0e9;color:#223930;font:16px system-ui}main{max-width:1120px;margin:auto}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:8px}svg{display:block;width:100%;height:auto;background:#fff;border:1px solid #c8d2cc;margin:12px 0}p{line-height:1.6}.facts{display:flex;gap:24px;flex-wrap:wrap}output{display:block;min-height:3em}</style><main><h1>M5 本机实际GPU采样</h1><p>1280×720，Chromium153，Apple M5 Pro Metal。时间没有加速。呈现间隔包含长帧；堆指标不等于全部设备内存。每个点可点击查看。图表不是美术验收。</p><nav><label>样本 <select id="kind"><option value="natural">20分钟自然运行</option><option value="0">东门活跃事件</option><option value="1">北门活跃事件</option><option value="2">南门活跃事件</option></select></label><a href="REPORT.md">交付与限制</a></nav><div class="facts" id="facts"></div><h2>呈现间隔：95分位和最长帧</h2><svg id="frames" viewBox="0 0 1080 270" role="img" aria-label="帧间隔曲线"></svg><h2>JavaScript堆</h2><svg id="heap" viewBox="0 0 1080 270" role="img" aria-label="堆变化曲线"></svg><output id="detail">选择图上采样点查看原始结果。</output><p>20分钟同时记录自然保护期与冷却，不把受控生成或离线时间冒充正常调度。原始JSON保留全部字段。绿色为95分位／堆，棕色为最长帧。</p></main><script type="module">const data=await fetch('soak-results.json').then(r=>r.json()),kind=document.querySelector('#kind'),detail=document.querySelector('#detail');const node=(tag,attrs)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;};function chart(id,rows,series,label){const svg=document.querySelector('#'+id);svg.replaceChildren();const max=Math.max(1,...rows.flatMap(r=>series.map(s=>s.get(r))));for(let i=0;i<=4;i++){const y=220-i*45;svg.append(node('line',{x1:60,x2:1040,y1:y,y2:y,stroke:'#e2e7e3'}));const text=node('text',{x:4,y:y+5,fill:'#436454','font-size':12});text.textContent=(max*i/4).toFixed(1);svg.append(text);}series.forEach(s=>{const points=rows.map((r,i)=>`${60+i*980/Math.max(1,rows.length-1)},${220-s.get(r)/max*180}`).join(' ');svg.append(node('polyline',{points,fill:'none',stroke:s.color,'stroke-width':2}));rows.forEach((r,i)=>{const c=node('circle',{cx:60+i*980/Math.max(1,rows.length-1),cy:220-s.get(r)/max*180,r:4,fill:s.color,tabindex:0});c.setAttribute('role','button');c.setAttribute('aria-label',`采样${i+1} ${s.name}`);const inspect=()=>detail.textContent=`第${i+1}点：95分位${r.帧间隔.九五分位.toFixed(2)}毫秒，最长帧${r.帧间隔.最大.toFixed(2)}毫秒；事件${r.序号}／结算${r.结算号}，来袭${r.来袭实体}，箭${r.箭}，堆${(r.浏览器指标.JSHeapUsedSize/1e6).toFixed(2)}MB，文档${r.浏览器指标.Documents}，监听器${r.浏览器指标.JSEventListeners}`;c.onclick=inspect;c.onkeydown=e=>{if(e.key==='Enter')inspect();};svg.append(c);});});const text=node('text',{x:60,y:255,fill:'#436454','font-size':13});text.textContent=label;svg.append(text);}function render(){const rows=kind.value==='natural'?data.自然持续运行:data.活跃采样[Number(kind.value)].样本;document.querySelector('#facts').textContent=`采样窗口${rows.length}；页面错误${data.错误.length}；自然功能结果${data.功能结果}。自然采样每约30秒，活跃采样每约0.5秒。`;chart('frames',rows,[{name:'95分位毫秒',get:r=>r.帧间隔.九五分位,color:'#287a58'},{name:'最长帧毫秒',get:r=>r.帧间隔.最大,color:'#956243'}],kind.value==='natural'?'从开始到20分钟，点按时间顺序':'连续15秒，点按时间顺序');chart('heap',rows,[{name:'堆MB',get:r=>r.浏览器指标.JSHeapUsedSize/1e6,color:'#287a58'}],'堆包含正常GC波动，不能用单个峰值判断泄漏');}kind.onchange=render;render();</script></html>
