<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三门驻防实机候选对照</title><style>body{margin:0;padding:20px;background:#e9e7df;color:#243830;font:16px system-ui}main{max-width:1280px;margin:auto}nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}select{font:inherit;padding:8px}figure{margin:18px 0}img{display:block;width:100%;height:auto}figcaption{margin:8px 0}p{line-height:1.6}</style><main><h1>三门驻防实机候选对照</h1><p>固定1280×720、相同镜头站位与08:00昼间。这里提供完整视口，不是全村缩略图。功能回归另有运行证据；新纵向弓手与北南门摆放待人工确认。</p><nav><label>场景 <select id="view"><option value="east-gate">东门</option><option value="north-gate" selected>北门</option><option value="south-gate">南门</option></select></label><label><input id="clean" type="checkbox" checked> 无HUD检查</label></nav><figure><figcaption>M3已认可基线</figcaption><img id="before" alt="修改前完整视口"></figure><figure><figcaption>M4候选，尚未人工确认</figcaption><img id="after" alt="修改后完整视口"></figure><p><a href="REPORT.md">功能与美术分别报告</a> · <a href="PLAN.md">布局与改动清单</a></p></main><script>const view=document.querySelector('#view'),clean=document.querySelector('#clean');function render(){const suffix=clean.checked?'-clean':'';document.querySelector('#before').src=`before/${view.value}${suffix}.png`;document.querySelector('#after').src=`after-v2/${view.value}${suffix}.png`;}view.onchange=clean.onchange=render;render();</script></html>
