<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>剑风素材固定预览</title>
<style>body{margin:20px;background:#172b27;color:#e0eee5;font:15px system-ui}button,label{margin-right:14px}canvas{display:block;max-width:100%;background:#537459;border:1px solid #9bba9e;margin:12px 0}button{padding:8px}small{color:#bdcfc6}</style>
<h1>剑风·一线斩：独立素材预览</h1><p>仅验证素材与锚点，不接入战斗、碰撞、授予或伤害。</p><p id="approval">正在读取素材认可状态。</p>
<button id="play">暂停播放</button><button id="restart">从头播放</button><label><input id="marks" type="checkbox" checked>显示根与武器采样点</label><label>逐帧 <input id="scrub" type="range" min="0" max="1400" value="0"></label><small id="status">装载中</small>
<canvas id="normal" width="1200" height="680"></canvas><canvas id="zoom" width="1200" height="570"></canvas>
<script type="module">
const meta=await fetch('./metadata.json').then(r=>r.json()),names=['hero-sword-wind','sword-wind-release','sword-wind-flight','sword-wind-hit','sword-wind-dissolve','sword-wind-ground'];
document.querySelector('#approval').textContent=meta.角色.用户美术认可&&meta.效果.find(e=>e.名称==='ground')?.用户美术认可?'上撩动作与地面切痕已通过用户视觉验收；其余效果仍为临时素材，音色、手感与设备性能另行验收。':'素材包含待认可内容，具体状态见元数据与素材验收记录。';
const pictures={};await Promise.all(names.map(async name=>{const p=new Image();p.src=`/assets/animation/sword-wind/${name}.png`;await p.decode();pictures[name]=p;}));
let playing=true,elapsed=0,last=performance.now();const times=meta.角色.帧时刻;
const frame=t=>Math.max(0,times.findLastIndex(at=>t>=at));
function drawHero(ctx,x,y,facing,t,scale,marks){const pose=frame(Math.min(400,t)),view=facing===0?0:facing===1?1:2;ctx.save();ctx.translate(x,y);ctx.scale((facing===2?-1:1)*scale,scale);ctx.drawImage(pictures['hero-sword-wind'],pose*160,view*160,160,160,-72.5,-154/160*145,145,145);ctx.restore();if(marks){ctx.fillStyle='#ffd988';ctx.fillRect(x-2,y-2,4,4);const p=meta.角色.源剑柄剑尖[view][pose],r=meta.角色.源根[view][pose];for(let i=0;i<4;i+=2){ctx.beginPath();ctx.fillStyle=i?'#93edff':'#ffd988';ctx.arc(x+(p[i]-r[0])*145/650*(facing===2?-1:1)*scale,y+(p[i+1]-r[1])*145/650*scale,2.5,0,Math.PI*2);ctx.fill();}}}
function effect(ctx,key,index,x,y,size,rotation=0){const p=pictures[key];ctx.save();ctx.translate(x,y);ctx.rotate(rotation);const height=key==='sword-wind-ground'?size*52/36:size;ctx.drawImage(p,index*128,0,128,128,-size/2,-height/2,size,height);ctx.restore();}
function draw(canvas,mult){const ctx=canvas.getContext('2d'),t=elapsed%1400,marks=document.querySelector('#marks').checked;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#eaf5e9';ctx.font='16px system-ui';ctx.fillText(mult===1?'正常游戏比例 / 正常速度':'放大检查 / 三倍尺寸（不代表实机可读性）',18,25);
 for(let d=0;d<4;d++){const x=150+d*300,y=mult===1?180:380;ctx.fillStyle='#eaf5e9';ctx.fillText(['正面','背面','左向统一镜像','右侧原视角'][d],x-60,55);drawHero(ctx,x,y,d,Math.min(t,400),mult,marks);if(mult===1&&t>=110&&t<174){const view=d===0?0:d===1?1:2,p=meta.角色.源剑柄剑尖[view][3],r=meta.角色.源根[view][3],angle=[Math.PI/2,-Math.PI/2,Math.PI,0][d],attachment=meta.角色.效果接点[view],ax=attachment[0]*Math.cos(angle)-attachment[1]*(d===2?-1:1)*Math.sin(angle),ay=attachment[0]*Math.sin(angle)+attachment[1]*(d===2?-1:1)*Math.cos(angle);effect(ctx,'sword-wind-release',Math.floor((t-110)/16),x+(p[0]+(p[2]-p[0])*.35-r[0])*145/650*(d===2?-1:1)-ax,y+(p[1]+(p[3]-p[1])*.35-r[1])*145/650-ay,128,angle);}}
 if(mult===1){for(let row=0;row<3;row++){const y=row===2?275:280+row*150,rotation=row===2?Math.PI/2:0;ctx.fillStyle='#eaf5e9';ctx.fillText(['离刃 → 飞行 → 命中','离刃 → 飞行 → 自然消散','纵向直线飞行'][row],row===2?900:18,y-50);const age=t-110,distance=Math.min(300,Math.max(0,age)*.9),x=row===2?1000:300+distance,ey=row===2?y+distance:y;if(row<2)drawHero(ctx,292,y+29,3,Math.min(t,400),1,marks);if(age>=0){for(let along=0;along<distance;along+=36){const born=along/.9,a=age-born;if(a>=850)continue;ctx.save();ctx.globalAlpha=Math.min(1,(850-a)/200);effect(ctx,'sword-wind-ground',Math.min(5,Math.floor(a/110)),row===2?1000:300+along+18,row===2?y+along+18:y+29,36,rotation);ctx.restore();}}if(age>=0&&age<64)effect(ctx,'sword-wind-release',Math.min(3,Math.floor(age/16)),x,ey,128,rotation);else if(age>=64&&age<334)effect(ctx,'sword-wind-flight',Math.floor((age-64)/18)%6,x,ey,128,rotation);else if(age>=334&&age<494&&row===0)effect(ctx,'sword-wind-hit',Math.min(7,Math.floor((age-334)/20)),641,y,144,rotation);else if(age>=334&&age<430&&row>0)effect(ctx,'sword-wind-dissolve',Math.min(3,Math.floor((age-334)/24)),row===2?1000:600,row===2?575:y,128,rotation);}}
 else{ctx.fillStyle='#eaf5e9';ctx.fillText('效果单帧：离刃、飞行、命中、消散、地面切痕',18,450);['release','flight','hit','dissolve','ground'].forEach((name,i)=>effect(ctx,`sword-wind-${name}`,Math.floor(t/60)%meta.效果.find(e=>e.名称===name).帧数,100+i*240,510,144));}}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停播放':'继续播放'};
document.querySelector('#restart').onclick=()=>{elapsed=0};document.querySelector('#scrub').oninput=e=>{playing=false;elapsed=+e.target.value;document.querySelector('#play').textContent='继续播放'};
function loop(now){if(playing)elapsed+=now-last;last=now;draw(document.querySelector('#normal'),1);draw(document.querySelector('#zoom'),3);document.querySelector('#status').textContent=`已装载 ${names.length} 个图集；时间 ${Math.floor(elapsed%1400)} 毫秒；角色帧 ${frame(Math.min(400,elapsed%1400))+1}`;if(playing)document.querySelector('#scrub').value=elapsed%1400;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
