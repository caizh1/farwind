<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>迎风架剑动作核查</title><style>body{font-family:system-ui;background:#e7e4d6;color:#263c36;margin:28px}section{display:grid;grid-template-columns:repeat(4,160px);gap:16px;max-width:100%;overflow:auto}figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}.pose{width:145px;height:145px;background-image:url('../../../public/assets/animation/hero-parry.png');background-size:580px 435px;border-bottom:1px solid #6d867c}h2{font-size:18px}p{max-width:760px}</style><h1>迎风架剑 · 固定根动作图</h1><p>独立十二姿态，左向仅镜像右向。下列按游戏显示尺寸预览，不按含剑包围盒缩放。图中所有脚底沿同一地面根；素材仍标记临时，用户美术与手感验收未完成。</p><main></main><script>const views=['正面','背面','右侧面','左侧面（镜像）'],names=['架剑','受力','拨开','持剑就绪'];views.forEach((v,row)=>{const h=document.createElement('h2');h.textContent=v;document.querySelector('main').append(h);const section=document.createElement('section');names.forEach((n,col)=>{const f=document.createElement('figure'),p=document.createElement('div'),c=document.createElement('figcaption');p.className='pose';p.style.backgroundPosition=`${-col*145}px ${-Math.min(row,2)*145}px`;if(row===3)p.style.transform='scaleX(-1)';c.textContent=n;f.append(p,c);section.append(f)});document.querySelector('main').append(section)});</script></html>
