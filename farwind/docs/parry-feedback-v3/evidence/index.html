<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弹反反馈第三轮实机对照</title>
<style>body{margin:0;background:#e8e4d7;color:#243b31;font:16px/1.6 system-ui}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:25px}nav,.sounds{display:flex;gap:14px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:8px}video{display:block;width:100%;margin:18px 0;background:#20362d}audio{display:block;width:280px;max-width:100%}article{padding:12px;background:#f7f4e9;border-radius:8px}p{max-width:950px}.sounds{align-items:stretch}.sounds article{flex:1 1 280px}a{color:#1b6258}</style>
<main><h1>弹反反馈第三轮 · 实际游戏音轨</h1><p>相同玩法参数与慢速练习场景。按正常比例提示起按，实际键盘预约二、三刀。录像没有后期补音；切换只播放已记录片段，不修改游戏。声音为原创合成原型，新动作仍待用户美术验收。</p>
<nav><label>对照版本 <select id="variant"><option value="ab-A">A 修改前</option><option value="ab-B">B 只修改声音</option><option value="ab-C">C 只修改动作、轨迹、特效与受力</option><option value="ab-D" selected>D 完整联动</option><option value="perfect-combo">精准成功并接连击</option><option value="cancel">成功停顿中风步取消</option><option value="wild-slime">正式史莱姆</option><option value="wild-leaf">正式叶灵</option><option value="two-enemies">两敌人前方连续接触</option><option value="leaf-projection">叶灵训练投影</option><option value="defense">正式防御战敌人</option><option value="pause-reset">暂停、失焦、会话清理</option><option value="death-newgame">实际死亡与新游戏</option></select></label><button id="cue">跳到来招前</button><label><input type="checkbox" id="mute">静音检查画面</label></nav>
<video id="movie" controls playsinline preload="metadata"></video><p id="metrics"></p><p>观看重点：第一次剑闪是招架成功；第二次切向刃闪只在反斩确实命中时出现。取消片段没有第二次命中重音。全片响度包含菜单和后续连击，不能代替耳机或扬声器的主观等响试听。</p>
<h2>分身份试听原型</h2><p>下方是相同合成器导出的原始单音，不是后期添加到录像中的音轨。设备舒适度、连续几十次疲劳与用户辨识测试尚未完成。</p><div class="sounds" id="sounds"></div>
<p><a href="../REPORT.md">实际报告</a> · <a href="../DESIGN.md">规则与时序</a> · <a href="../ASSETS.md">素材来源</a> · <a href="media-index.json">原始测量与重拍索引</a> · <a href="counter-fixed-preview.png">固定根六姿态预览</a></p></main>
<script>const movie=document.querySelector('#movie'),select=document.querySelector('#variant'),mute=document.querySelector('#mute');let records=[];const show=()=>{movie.pause();movie.src=`media/${select.value}.mp4`;movie.muted=mute.checked;const r=records.find(r=>r.场景===select.value);document.querySelector('#metrics').textContent=r?`采样峰值 ${r.测量.采样峰值分贝} 分贝；真峰值估计 ${r.测量.真峰值分贝} 分贝；全片综合响度 ${r.测量.全片综合响度} LUFS。`:'测量索引加载中';};select.onchange=show;mute.onchange=()=>movie.muted=mute.checked;document.querySelector('#cue').onclick=()=>{const r=records.find(r=>r.场景===select.value);movie.currentTime=Math.max(0,(r?.重拍[0]?.视频位置秒??1)-.8);movie.play()};fetch('media-index.json').then(r=>r.json()).then(r=>{records=r.记录;show()});show();const sounds=[['架剑轻响','guard-start'],['敌人蓄力','enemy-charge'],['敌人真正出手','enemy-strike'],['普通招架接触','parry-contact'],['精准招架接触','parry-perfect-contact'],['拨开释放','deflect-release'],['反斩破风','counter-swing'],['反斩命中史莱姆','counter-hit-slime'],['反斩命中叶灵','counter-hit-leaf'],['余势轻挡','afterguard']];for(const [label,name]of sounds){const box=document.createElement('article'),text=document.createElement('b'),audio=document.createElement('audio');text.textContent=label;audio.controls=true;audio.preload='none';audio.src=`../assets/audio/${name}.wav`;box.append(text,audio);document.querySelector('#sounds').append(box)}</script></html>
