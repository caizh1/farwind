if">4处兴趣点 · 6组遭遇</text><rect x="534.8499999999999" y="489" width="434.3" height="344" rx="28" fill="#e1d3a5" stroke="#84764c" stroke-width="4"/><ellipse cx="792.85" cy="682.5" rx="55.9" ry="49.449999999999996" fill="#73a9b2"/><polyline points="1259.4,536.3 1233.6,613.7 1257.25,699.7 1227.15,792.15 1265.85,865.25" fill="none" stroke="#6b9aa7" stroke-width="18" stroke-linecap="round"/><ellipse cx="846.6" cy="992.1" rx="86" ry="64.5" fill="#95b7a7"/><ellipse cx="786.4" cy="1048" rx="58.05" ry="47.3" fill="#a95f4630" stroke="#a15e47" stroke-dasharray="5 7"/><ellipse cx="152.15" cy="762.05" rx="58.05" ry="47.3" fill="#a95f4630" stroke="#a15e47" stroke-dasharray="5 7"/><ellipse cx="835.85" cy="284.75" rx="58.05" ry="47.3" fill="#a95f4630" stroke="#a15e47" stroke-dasharray="5 7"/><ellipse cx="1315.3" cy="678.2" rx="58.05" ry="47.3" fill="#a95f4630" stroke="#a15e47" stroke-dasharray="5 7"/><polyline points="504.75,467.5 752,452.45 997.1,469.65 1005.6999999999999,682.5 986.35,863.1 730.5,873.85 502.59999999999997,848.05 504.75,467.5" fill="none" stroke="#e9f5bd" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" /><polyline points="193,639.5 296.2,398.7 524.0999999999999,286.9 724.05,304.1" fill="none" stroke="#6c728a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="13 9"/><polyline points="724.05,304.1 958.4,334.2 1076.65,471.8 1186.3,645.95" fill="none" stroke="#6c728a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="13 9"/><polyline points="711.15,833 730.5,873.85 773.5,946.9499999999999 661.7,1030.8 872.4,1088.85" fill="none" stroke="#f9eed0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><polyline points="534.8499999999999,749.15 502.59999999999997,749.15 386.5,704 193,639.5" fill="none" stroke="#f9eed0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><polyline points="693.95,489 698.25,454.6 646.65,385.79999999999995 724.05,304.1" fill="none" stroke="#