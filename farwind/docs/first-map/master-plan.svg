0" font-size="17" font-family="PingFang SC, sans-serif">遗迹回廊</text><text x="65" y="1213" fill="#304a40" font-size="19" font-family="PingFang SC, sans-serif">道路：浅色为主要道路 · 浅绿为近郊环线 · 虚线为远端跨区通路 · 铜色节点为可修复捷径</text><text x="65" y="1246" fill="#304a40" font-size="18" font-family="PingFang SC, sans-serif">24处主要兴趣点与32组遭遇包含据点、精英及首领；具体地形与内容仍须逐阶段实机验证。</text><g><title>芦苇渡口：辨认浅滩与第一处安全渡口，连接南门采集路线</title><circle cx="730.5" cy="897.5" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="726.5" y="902.5" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">1</text></g><text x="70" y="1310" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">01  芦苇渡口</text><g><title>药草洼地：采集与孢子风险，引出药品补给问题</title><circle cx="687.5" cy="957.6999999999999" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="683.5" y="962.6999999999999" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">2</text></g><text x="70" y="1348" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">02  药草洼地</text><g><title>荒弃果园：食物来源与绕过沼地的回程分支</title><circle cx="904.65" cy="936.1999999999999" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="900.65" y="941.1999999999999" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">3</text></g><text x="70" y="1386" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">03  荒弃果园</text><g><title>孢根巢地：南向威胁来源，清剿恢复采集道并降低骚扰预算</title><circle cx="786.4" cy="1048" r="13" fill="#a25239" stroke="#46594b" stroke-width="1.5"/><text x="782.4" y="1053" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">4</text></g><text x="70" y="1424" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">04  孢根巢地</text><g><title>断堤水闸：木工修复后接通堤桥回程，提供南北不同路线</title><circle cx="943.35" cy="1075.9499999999998" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="939.35" y="1080.9499999999998" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">5</text></g><text x="70" y="1462" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">05  断堤水闸</text><g><title>旧农庄：农舍遗物与兽径线索，连接旧道调查</title><circle cx="311.25" cy="699.7" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="307.25" y="704.7" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">6</text></g><text x="70" y="1500" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">06  旧农庄</text><g><title>失修商车：短段护送与贸易补给，避免重复空走</title><circle cx="203.75" cy="626.5999999999999" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="199.75" y="631.5999999999999" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">7</text></g><text x="430" y="1310" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">07  失修商车</text><g><title>荆狼巢穴：西向威胁来源，侧袭巡游具有可追溯起点</title><circle cx="152.15" cy="762.05" r="13" fill="#a25239" stroke="#46594b" stroke-width="1.5"/><text x="148.15" y="767.05" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">8</text></g><text x="430" y="1348" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">08  荆狼巢穴</text><g><title>围猎林隙：头狼改变包夹方向，场地保留两条脱离路线</title><circle cx="251.04999999999998" cy="802.9" r="13" fill="#705479" stroke="#46594b" stroke-width="1.5"/><text x="247.04999999999998" y="807.9" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">9</text></g><text x="430" y="1386" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">09  围猎林隙</text><g><title>旧道路口：清障与西门修复任务，将旧道接回村内</title><circle cx="433.8" cy="673.9" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="425.8" y="678.9" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">10</text></g><text x="430" y="1424" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">10  旧道路口</text><g><title>旧哨站：恢复预警设施，明确集结方向并延长预兆</title><circle cx="696.1" cy="304.1" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="688.1" y="309.1" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">11</text></g><text x="430" y="1462" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">11  旧哨站</text><g><title>曲折山口：有限视野的山路冲锋遭遇，可绕行上坡退路</title><circle cx="588.6" cy="387.95" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="580.6" y="392.95" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">12</text></g><text x="430" y="1500" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">12  曲折山口</text><g><title>裂岩兽穴：北向威胁来源，清理后山路巡游减少</title><circle cx="835.85" cy="284.75" r="13" fill="#a25239" stroke="#46594b" stroke-width="1.5"/><text x="827.85" y="289.75" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">13</text></g><text x="790" y="1310" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">13  裂岩兽穴</text><g><title>回声石坪：冲锋精英撞击可破坏的场地障碍，创造反击窗口</title><circle cx="749.85" cy="228.85" r="13" fill="#705479" stroke="#46594b" stroke-width="1.5"/><text x="741.85" y="233.85" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">14</text></g><text x="790" y="1348" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">14  回声石坪</text><g><title>听风望台：侦察足迹与旧哨记录，连入西北商路</title><circle cx="489.7" cy="276.15" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="481.7" y="281.15" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">15</text></g><text x="790" y="1386" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">15  听风望台</text><g><title>风铃溪口：风铃机关教学与溪谷选路</title><circle cx="1113.2" cy="699.7" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="1105.2" y="704.7" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">16</text></g><text x="790" y="1424" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">16  风铃溪口</text><g><title>菌光林：稀缺材料与远近程组合遭遇，采集不是单纯领物</title><circle cx="1231.45" cy="777.1" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="1223.45" y="782.1" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">17</text></g><text x="790" y="1462" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">17  菌光林</text><g><title>棘枝营地：东向威胁来源，清理后打开深林安全段</title><circle cx="1315.3" cy="678.2" r="13" fill="#a25239" stroke="#46594b" stroke-width="1.5"/><text x="1307.3" y="683.2" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">18</text></g><text x="790" y="1500" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">18  棘枝营地</text><g><title>孢环空地：孢子精英轮换危险扇区，靠移动与接近处理</title><circle cx="1194.9" cy="854.5" r="13" fill="#705479" stroke="#46594b" stroke-width="1.5"/><text x="1186.9" y="859.5" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">19</text></g><text x="1150" y="1310" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">19  孢环空地</text><g><title>三风石泉：承接已有三风石与风之传承，解锁遗迹入口</title><circle cx="1270.15" cy="544.9" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="1262.15" y="549.9" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">20</text></g><text x="1150" y="1348" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">20  三风石泉</text><g><title>遗迹门庭：集中补给提示、章节入口和明确退出路线</title><circle cx="1111.05" cy="420.2" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="1103.05" y="425.2" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">21</text></g><text x="1150" y="1386" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">21  遗迹门庭</text><g><title>风脉前庭：分批战斗与地形综合挑战，不堵死撤退口</title><circle cx="1220.7" cy="370.75" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="1212.7" y="375.75" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">22</text></g><text x="1150" y="1424" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">22  风脉前庭</text><g><title>回音机关厅：组合风铃机关，完成后开放可步行回廊</title><circle cx="1347.55" cy="329.9" r="13" fill="#eae5cd" stroke="#46594b" stroke-width="1.5"/><text x="1339.55" y="334.9" fill="#304a40" font-size="13" font-family="PingFang SC, sans-serif">23</text></g><text x="1150" y="1462" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">23  回音机关厅</text><g><title>失序风核：两阶段章节首领、明确重试入口与胜后返村结算</title><circle cx="1265.85" cy="252.5" r="13" fill="#673b36" stroke="#46594b" stroke-width="1.5"/><text x="1257.85" y="257.5" fill="#fff3d5" font-size="13" font-family="PingFang SC, sans-serif">24</text></g><text x="1150" y="1500" fill="#304a40" font-size="20" font-family="PingFang SC, sans-serif">24  失序风核</text><text x="65" y="1560" fill="#304a40" font-size="18" font-family="PingFang SC, sans-serif">红圈为威胁来源及活动范围；紫圈为精英；深红为章节首领。蓝色为水域，浅青为湿地。</text><text x="65" y="1596" fill="#304a40" font-size="18" font-family="PingFang SC, sans-serif">村门连接守军岗位；主路兼做撤退路线，铜色节点提供可修复捷径。点位编号对应兴趣点登记表。</text></svg>