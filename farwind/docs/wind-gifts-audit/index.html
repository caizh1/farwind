<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>风赐特效逐项调研</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#101f26;color:#dfe9dd;font:15px system-ui}main{max-width:1240px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#b8cfc9}nav{display:flex;align-items:center;gap:16px;margin:16px 0}select,button{font:inherit;color:inherit;background:#28434c;border:1px solid #58766e;border-radius:6px;padding:8px}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}article{border:1px solid #46605d;border-radius:8px;overflow:hidden;background:#20383e}h2{font-size:15px;margin:10px 14px}canvas{display:block;width:100%;height:auto}small{display:block;padding:5px 14px 10px;color:#acc4bd}@media(max-width:850px){#grid{grid-template-columns:1fr}}
</style><main><h1>风赐特效逐项调研</h1><p>复用当前战斗渲染器的独立预览；每项展示生命周期的18%、42%、74%。用于观察形态和材质，不代表正式存档实战截图。</p><nav><label>目录分页 <select id="page" aria-label="目录分页"></select></label><span role="status">材质加载中</span></nav><section id="grid"></section></main>
<script type="module">
import {WIND_GIFT_ART} from '/src/game/entities/windGiftArt.ts';
import {GIFT_CHOREOGRAPHY,GIFT_MATERIAL_URL} from '/src/game/entities/windGiftChoreography.ts';
import {paintWindGiftFx} from '/src/game/entities/windGiftMotion.ts';
import {canvasInk} from '/src/game/entities/runeView.ts';
import {WIND_GIFTS,GIFT_RESONANCES} from '/src/game/systems/windGifts.ts';
const ids=Object.keys(WIND_GIFT_ART).filter(id=>!['chain','blackHole'].includes(id)),select=document.querySelector('#page'),grid=document.querySelector('#grid'),image=new Image();image.src=GIFT_MATERIAL_URL();await image.decode();
for(let i=0;i<Math.ceil(ids.length/12);i++){const option=document.createElement('option');option.value=String(i);option.textContent=`第${i+1}页 · ${i*12+1}—${Math.min(ids.length,(i+1)*12)}`;select.append(option)}
function draw(){grid.replaceChildren();const shown=ids.slice(Number(select.value)*12,(Number(select.value)+1)*12);for(const id of shown){const art=WIND_GIFT_ART[id],recipe=GIFT_CHOREOGRAPHY[id],card=document.createElement('article'),name=(WIND_GIFTS[id]??GIFT_RESONANCES[id]).name;card.innerHTML=`<h2>${name}${GIFT_RESONANCES[id]?' · 共鸣':''}</h2><canvas width="600" height="180" aria-label="${name}三个动画阶段"></canvas><small>${GIFT_RESONANCES[id]?'共鸣':'风赐'} · ${art.life}毫秒 · ${art.ground?'地面层':'身体层'}</small>`;grid.append(card);const g=card.querySelector('canvas').getContext('2d');g.fillStyle='#284b48';g.fillRect(0,0,600,180);[.18,.42,.74].forEach((phase,i)=>{g.save();g.beginPath();g.rect(i*200,0,200,180);g.clip();g.translate(i*200+100,99);g.scale(.75,.75);g.globalAlpha=.25;g.fillStyle='#091a1d';g.beginPath();g.ellipse(0,28,33,8,0,0,Math.PI*2);g.fill();g.globalAlpha=.25;g.fillStyle='#8fb994';g.beginPath();g.ellipse(0,-8,16,28,0,0,Math.PI*2);g.fill();const ink=canvasInk(g);ink.giftMaterial=(m,x,y,w,h,a,rot=0)=>{g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(rot);g.drawImage(image,m%6*256,Math.floor(m/6)*256,256,256,-w/2,-h/2,w,h);g.restore();};const link=recipe.shape==='link'||id==='drinkDew';paintWindGiftFx(ink,{id:0,visual:'gift:'+id,rune:'',point:link?{x:-70,y:0}:{x:0,y:0},end:link?{x:70,y:-10}:undefined,radius:art.size,born:0,life:art.life,direction:{x:1,y:0}},phase*art.life);g.restore();g.globalAlpha=1;g.font='12px system-ui';g.fillStyle='#cde1d8';g.textAlign='center';g.fillText(`${Math.round(phase*100)}%`,i*200+100,169);if(i<2){g.strokeStyle='#487169';g.lineWidth=1;g.beginPath();g.moveTo((i+1)*200,0);g.lineTo((i+1)*200,180);g.stroke()}})}document.querySelector('[role=status]').textContent=`共${ids.length}项 · 当前${shown.length}项 · 材质已加载`}
select.addEventListener('change',draw);draw();
</script></html>
