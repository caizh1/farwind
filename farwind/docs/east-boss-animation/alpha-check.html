<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>东侧首领 · 透明边缘对照</title><style>body{margin:0;background:#17271f;color:#e7e8de;font:16px system-ui}main{max-width:1200px;margin:auto;padding:20px}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:12px 0}select,button{font:inherit;padding:7px}#stage canvas{max-width:100%}output{display:block;white-space:pre-wrap}</style><main><h1>东侧首领 · 透明边缘对照</h1><p>左：修复前压缩图。中：修复后压缩图。右：PNG 兼容图。左侧仅保留原结茧起手，其他动作隐藏。</p><div class="controls"><label>背景<select id="background"><option value="#17271f">深色</option><option value="#e6e1cf">浅色</option></select></label><label>动作<select id="clip"><option value="cocoon-enter">结茧起手对照</option><option value="idle">待机</option><option value="walk">行走</option><option value="cross-left">第一镰</option><option value="cross-right">第二镰</option><option value="death">死亡</option></select></label><label>方向<select id="direction"><option value="0">正面</option><option value="1">右前</option><option value="2">右侧</option><option value="3">右后</option><option value="4">背面</option><option value="5">左后</option><option value="6">左侧</option><option value="7">左前</option></select></label><button id="play">播放</button></div><div id="stage"></div><output id="status">准备图集</output></main><script type="module">
import Phaser from '/node_modules/phaser/dist/phaser.esm.js';
const m=await fetch('/assets/east-boss-animation/index.json',{cache:'no-cache'}).then(r=>r.json()),old=await fetch('./evidence/alpha-fix/before-index.json').then(r=>r.json());
const clip=document.querySelector('#clip'),direction=document.querySelector('#direction'),status=document.querySelector('#status');let elapsed=0,playing=false;document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放'};clip.onchange=()=>elapsed=0;
class Check extends Phaser.Scene{
 async create(){this.sprites=[200,600,1000].map(x=>this.add.sprite(x,430,'__WHITE').setVisible(false));this.loaded=new Set;this.pending=new Set;this.add.text(110,20,'修复前 · 压缩',{color:'#9cae94'});this.add.text(510,20,'修复后 · 压缩',{color:'#9cae94'});this.add.text(940,20,'PNG 兼容',{color:'#9cae94'});document.querySelector('#background').onchange=e=>this.cameras.main.setBackgroundColor(e.target.value);this.ready=true;}
 async loadPage(key,url,compressed,manifest,page){if(this.loaded.has(key)||this.pending.has(key))return;this.pending.add(key);try{const r=await fetch(url);if(!r.ok)throw Error('资源读取失败');const buf=await r.arrayBuffer();if(compressed){const data=Phaser.Textures.Parsers.KTXParser(buf);data.format=this.game.renderer.getCompressedTextureName('S3TC',data.internalFormat);this.textures.addCompressedTexture(key,data);}else{const image=new Image,u=URL.createObjectURL(new Blob([buf],{type:'image/png'}));try{image.src=u;await image.decode();this.textures.addImage(key,image)}finally{URL.revokeObjectURL(u)}}const t=this.textures.get(key);for(const [id,f]of Object.entries(manifest.frames))if(f.page===page)t.add(id,0,...f.rect);this.loaded.add(key);}catch(e){status.textContent=e.message}finally{this.pending.delete(key)}}
 update(now,dt){if(!this.ready)return;if(playing)elapsed+=Math.min(dt,100);const name=clip.value,d=direction.value,c=m.clips[name],time=elapsed%c.duration,seq=c.directions[d],id=[...seq].reverse().find(f=>f.at<=time).frame,f=m.frames[id],meta=m.pages[f.page];const specs=[{id:'cocoon-enter/'+d+'/0000',m:old,key:'old',url:'./evidence/alpha-fix/before-page-0000.ktx',compressed:true,page:0},{id,m,key:'new-'+f.page,url:'/assets/east-boss-animation/'+meta.ktx+'?v='+m.assetHash,compressed:true,page:f.page},{id,m,key:'png-'+f.page,url:'/assets/east-boss-animation/'+meta.png+'?v='+m.assetHash,compressed:false,page:f.page}];for(let i=0;i<3;i++){const s=specs[i],frame=s.m.frames[s.id];if(i===0&&(name!=='cocoon-enter'||time>1)){this.sprites[i].setVisible(false);continue}this.loadPage(s.key,s.url,s.compressed,s.m,s.page);if(this.loaded.has(s.key)){this.sprites[i].setTexture(s.key,s.id).setOrigin(frame.pivot[0]/frame.rect[2],frame.pivot[1]/frame.rect[3]).setScale(300/512).setAlpha(name==='death'?Math.max(0,1-Math.max(0,time-1200)/500):1).setVisible(true)}}status.textContent=`方向 ${d} · 时间 ${Math.round(time)} 毫秒 · ${this.pending.size?'加载中':'帧就绪'}\n资源版本 ${m.assetHash}`;}
}
new Phaser.Game({type:Phaser.WEBGL,parent:'stage',width:1200,height:500,backgroundColor:'#17271f',scene:Check,audio:{noAudio:true}});
</script></html>
