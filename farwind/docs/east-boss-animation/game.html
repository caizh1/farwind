<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远风之地 · 东侧首领实战验收</title><body><div id="game"></div><div id="ui"></div>
<aside id="inspection"><details open><summary>只读实战记录</summary><p>此入口运行正式世界。导入独立样本后使用正常键鼠；记录器不修改战斗状态。</p><div class="actions"><button id="record">开始录制</button><button id="report">生成检查记录</button><a id="recording" hidden download="east-boss-gameplay.webm">下载实战录像</a><a id="diagnostic" hidden download="east-boss-gameplay.json">下载检查记录</a></div><output id="snapshot">等待正式世界初始化</output></details></aside>
<style>#inspection{position:fixed;right:12px;bottom:100px;width:300px;max-height:330px;overflow:auto;z-index:12000;background:#10251fe8;color:#e1eee2;border:1px solid #6a8b73;border-radius:8px;padding:10px;font:12px/1.5 system-ui}#inspection p{margin:6px 0}#inspection .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#inspection button,#inspection a{font:inherit;color:#e2f6c8;background:#294337;padding:5px;border:1px solid #648573;border-radius:4px}#inspection output{display:block;white-space:pre-wrap;margin-top:6px}</style>
<script type="module">
import '/src/main.ts';
const snapshots=[],frames=[];let recorder,chunks=[],previous=performance.now(),recordStart=0;
const frame=now=>{frames.push(now-previous);previous=now;if(frames.length>36000)frames.shift();requestAnimationFrame(frame)};requestAnimationFrame(frame);
setInterval(()=>{const s=window.__farwind?.();if(!s)return;const e=s.enemies?.find(e=>e.id==='boss-bound-branch');const row={时间:s.skillGrowth?.sim,界面:s.mode,玩家:s.state.player,首领:e?{位置:[e.x,e.y],生命:e.hp,战斗:e.behavior,动画:e.art,弹反:e.parried}:null,据点:s.state.encounters.groups['east-thorn-camp'].boss,接触:s.bossContacts};snapshots.push(row);if(snapshots.length>3600)snapshots.shift();document.querySelector('#snapshot').textContent=JSON.stringify({时间:row.时间,界面:row.界面,生命:row.玩家.hp,玩家位置:[Math.round(row.玩家.x),Math.round(row.玩家.y)],首领生命:e?.hp,首领位置:e?[Math.round(e.x),Math.round(e.y)]:null,招式:e?.behavior?.attack?.skill,出手剩余:e?.behavior?.attack?Math.round(e.behavior.attack.contactAt-row.时间):null,动画:e?.art?.continuous,弹反:e?.parried,据点阶段:row.据点.stage},null,1)},250);
document.querySelector('#record').onclick=e=>{
 if(recorder?.state==='recording'){recorder.stop();e.target.textContent='开始录制';return}
 const canvas=document.querySelector('#game canvas');chunks=[];snapshots.length=0;frames.length=0;previous=performance.now();recordStart=previous;const stream=canvas.captureStream(60);recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:10000000});
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const a=document.querySelector('#recording');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.hidden=false;for(const t of stream.getTracks())t.stop()};recorder.start(1000);e.target.textContent='结束录制';canvas.focus();
};
document.querySelector('#report').onclick=()=>{const a=document.querySelector('#diagnostic');const sorted=[...frames].sort((a,b)=>a-b);a.href=URL.createObjectURL(new Blob([JSON.stringify({说明:'独立初始样本，正式世界、正式键鼠和战斗结算；未在运行中修改生命、坐标、时钟或通关状态。',地址:location.href,像素比:devicePixelRatio,视口:[innerWidth,innerHeight],画布:[document.querySelector('canvas').width,document.querySelector('canvas').height],帧间隔:{样本数:frames.length,中位:sorted[Math.floor(sorted.length*.5)],百分之九十五:sorted[Math.floor(sorted.length*.95)],最大:sorted.at(-1)},录制开始:recordStart,帧间隔原始:frames,采样:snapshots},null,2)],{type:'application/json'}));a.hidden=false};
</script></body></html>
