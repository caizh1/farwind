<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>弹反反馈对照</title><style>body{margin:0;background:#203b32;color:#f5efd4;font:15px system-ui}nav{display:flex;align-items:center;gap:12px;padding:12px;flex-wrap:wrap}select{font:inherit;padding:6px;background:#ece8d5}iframe{display:block;width:100%;height:calc(100vh - 90px);border:0}p{margin:0 12px 8px}</style><nav><label>同玩法对照 <select id="variant"><option value="A">A 修改前</option><option value="B">B 只改声音</option><option value="C">C 只改画面</option><option value="D" selected>D 完整反馈</option></select></label><span>J 连击 · K 架剑 · L 风步</span></nav><p>开发服务有效；切换会重载。正式导入同一夹具后，靠近木桩开启练习。此页不修改运行中的游戏状态。生产构建固定完整反馈。</p><iframe id="game" title="实际游戏对照"></iframe><script>const select=document.querySelector('#variant'),game=document.querySelector('#game');const show=()=>{game.src=`/?feedback=${select.value}`;history.replaceState(null,'',`?feedback=${select.value}`)};select.value=new URLSearchParams(location.search).get('feedback')||'D';select.onchange=show;show();</script></html>
